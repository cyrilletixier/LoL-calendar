<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lol calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: une frise annuelle horizontale (couloirs « En jeu » puis « Esport »), puis un agenda mois par mois avec une fiche détail collante. */
  --bg:#eceff3;
  --surface:#ffffff;
  --surface-2:#f4f6f9;
  --ink:#141d28;
  --muted:#5a6574;
  --line:#d5dbe3;
  --gold:#946d1e;
  --c-intl:#a5791d;
  --c-league:#2c6aa3;
  --c-event:#7a4cb5;
  --c-patch:#6a7584;
  --s1:#3a6db0;
  --s2:#b3364c;
  --s3:#22897a;
  --ok:#2f8a4f;
  --font-display:"Cinzel","Trajan Pro",Georgia,serif;
  --font-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --font-cond:"Barlow Condensed","Arial Narrow",sans-serif;
  --label-w:178px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0a1018; --surface:#111a25; --surface-2:#16212f; --ink:#ebe4d2; --muted:#8f9aa8; --line:#233042;
    --gold:#d4ae63; --c-intl:#d4ae63; --c-league:#62a6e2; --c-event:#b694e8; --c-patch:#7e8a99;
    --s1:#6f9fe0; --s2:#e46d81; --s3:#4cc2ad; --ok:#5cc685;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0a1018; --surface:#111a25; --surface-2:#16212f; --ink:#ebe4d2; --muted:#8f9aa8; --line:#233042;
  --gold:#d4ae63; --c-intl:#d4ae63; --c-league:#62a6e2; --c-event:#b694e8; --c-patch:#7e8a99;
  --s1:#6f9fe0; --s2:#e46d81; --s3:#4cc2ad; --ok:#5cc685;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--gold)}
.wrap{max-width:1440px;margin:0 auto;padding:28px clamp(16px,3vw,40px) 48px;display:grid;gap:22px}

/* En-tête */
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.9rem,4vw,2.6rem);letter-spacing:.05em;margin:0;line-height:1;text-wrap:balance}
.brand p{margin:6px 0 0;color:var(--muted)}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.years,.langs{display:flex;gap:6px;align-items:center}
.years button,.langs button{border:1px solid var(--line);background:var(--surface);padding:6px 14px;border-radius:999px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer}
.years button[aria-pressed="true"],.langs button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.langs{padding-right:10px;border-right:1px solid var(--line)}
.years button:disabled{cursor:not-allowed;opacity:.5}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold) 20%,var(--gold) 80%,transparent);position:relative;opacity:.7}
.rule::after{content:"";position:absolute;left:50%;top:-4px;width:8px;height:8px;background:var(--bg);border:1px solid var(--gold);transform:translateX(-50%) rotate(45deg)}

/* Maintenant */
.now{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start;text-align:left}
.tile .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tile .v{font-weight:700;font-size:17px;line-height:1.25}
.tile .s{color:var(--muted);font-size:14px}
.tile ul{margin:0;padding:0;list-style:none;display:grid;gap:2px}
button.tile{cursor:pointer}
button.tile:hover{border-color:var(--gold)}

/* Filtres */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-right:4px}
.chip{--cat:var(--muted);display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 10px;font-size:14px;font-weight:600;cursor:pointer}
.chip::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--cat);transform:rotate(45deg)}
.chip[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
.chip.mini{font-weight:500;color:var(--muted)}
.chip.mini::before{display:none}

/* Frise */
.tl-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;position:relative}
.tl{position:relative}
.row{display:grid;grid-template-columns:var(--label-w) 1fr;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.lane-label{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line);padding:8px 12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.lane-label .sw{width:9px;height:9px;transform:rotate(45deg);background:var(--cat);flex:none;border-radius:1px}
.lane-label small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.row.group .lane-label,.row.group .track{background:var(--surface-2)}
.row.group .lane-label{font-family:var(--font-display);font-size:12px;letter-spacing:.14em;color:var(--gold);padding-top:5px;padding-bottom:5px}
.row.head .lane-label{font-family:var(--font-display);font-size:15px;letter-spacing:.06em}
.track{position:relative;min-height:22px}
.months{height:32px}
.mlabel{position:absolute;top:0;height:32px;display:flex;align-items:center;padding-left:7px;font-size:13px;font-weight:600;color:var(--muted);text-transform:capitalize}
.overlay{position:absolute;top:0;bottom:0;pointer-events:none;z-index:1}
.mline{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.today{position:absolute;top:0;bottom:0;width:2px;background:var(--gold);z-index:3}
.today span{position:absolute;top:7px;left:5px;font-size:11px;font-weight:700;color:var(--bg);background:var(--gold);padding:1px 6px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}

.item{position:absolute;z-index:2;display:flex;align-items:center;gap:4px;height:22px;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;font:600 12.5px/1 var(--font-cond);color:var(--ink)}
.item.flip{flex-direction:row-reverse}
.item .fill{height:22px;border-radius:4px;display:flex;align-items:center;padding:0 7px;overflow:hidden;background:color-mix(in srgb,var(--cat) 20%,var(--surface));box-shadow:inset 3px 0 0 var(--cat);flex:none}
.item.season .fill{background:color-mix(in srgb,var(--cat) 38%,var(--surface));box-shadow:none;font-weight:600}
.item.act .fill{background:color-mix(in srgb,var(--cat) 16%,var(--surface));box-shadow:inset 0 -2px 0 var(--cat)}
.item.approx .fill{outline:1px dashed color-mix(in srgb,var(--cat) 70%,transparent);outline-offset:-1px}
.item.cont .fill{border-top-right-radius:0;border-bottom-right-radius:0}
.item .dia{width:11px;height:11px;flex:none;background:var(--cat);transform:rotate(45deg);margin:0 2px;box-shadow:0 0 0 2px var(--surface)}
.item .tick{width:2px;height:16px;background:var(--cat);flex:none;border-radius:1px}
.item.patch{font-size:11.5px;color:var(--muted);font-weight:500}
.item.patch.key{color:var(--ink);font-weight:600}
.item .out{padding:0 2px}
.item:hover .fill,.item:hover .dia{filter:brightness(1.08)}
.item:hover .out{text-decoration:underline}
.item.sel .fill{outline:2px solid var(--gold);outline-offset:1px}
.item.sel .dia,.item.sel .tick{outline:2px solid var(--gold);outline-offset:2px}
.item.sel .out{color:var(--gold)}
.tl-note{font-size:13px;color:var(--muted);margin:6px 2px 0}

/* Agenda + fiche */
.below{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.detail{position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 18px 16px;display:grid;gap:12px;border-top:3px solid var(--cat,var(--gold))}
.detail .kind{display:flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.detail .kind i{width:9px;height:9px;background:var(--cat);transform:rotate(45deg);display:inline-block}
.detail h2{margin:0;font-size:22px;line-height:1.2;text-wrap:balance}
.detail .when{font-weight:600;font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.detail dl{margin:0;display:grid;gap:10px}
.detail dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.detail dd{margin:2px 0 0}
.detail .res{font-weight:700}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.live{border-color:var(--ok);color:var(--ok)}
.pill.next{border-color:var(--gold);color:var(--gold)}
.pill.approx{border-style:dashed}

.agenda{display:grid;gap:22px}
.agenda h3{font-family:var(--font-display);font-size:17px;letter-spacing:.06em;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.agenda h3 small{font-family:var(--font-body);font-size:13px;color:var(--muted);letter-spacing:0;font-weight:500}
.ag-list{display:grid;gap:4px}
.jump{display:flex;flex-wrap:wrap;gap:6px;position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 9px;font-size:13px;font-weight:600;cursor:pointer;text-transform:capitalize}
.jump button:disabled{opacity:.35;cursor:default}
.jump button.cur{border-color:var(--gold);color:var(--gold)}
.agenda section{scroll-margin-top:52px}
.ag{--cat:var(--muted);display:grid;grid-template-columns:152px minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid transparent;border-radius:8px;padding:9px 12px;cursor:pointer;box-shadow:inset 3px 0 0 var(--cat)}
.ag:hover{border-color:var(--line)}
.ag.sel{border-color:var(--gold)}
.ag .d{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px}
.ag .t{font-weight:600}
.ag .m{color:var(--muted);font-size:14px}
.ag .m b{color:var(--ink);font-weight:600}
.ag.patch{background:transparent;padding-top:5px;padding-bottom:5px}
.ag.patch .t{font-weight:500;color:var(--muted)}
.tag{font:600 12px var(--font-cond);letter-spacing:.04em;color:var(--cat);text-transform:uppercase;margin-right:6px}

footer{color:var(--muted);font-size:14px;display:grid;gap:8px;border-top:1px solid var(--line);padding-top:16px}
footer ul{margin:0;padding-left:18px;display:grid;gap:3px}
footer p{margin:0;max-width:75ch}

@media (max-width:960px){
  .below{grid-template-columns:1fr}
  .detail{position:static;order:-1}
}
@media (max-width:560px){
  :root{--label-w:118px}
  .lane-label{font-size:13px;padding:6px 8px}
  .lane-label small{display:none}
  .ag{grid-template-columns:1fr;gap:2px}
  .ag .pill{justify-self:start}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1 data-i18n="title"></h1>
      <p data-i18n="tagline"></p>
    </div>
    <div class="ctrls">
      <nav class="langs" id="langs" data-i18n-aria="langNav"></nav>
      <nav class="years" id="years" data-i18n-aria="yearNav"></nav>
    </div>
  </header>
  <div class="rule" aria-hidden="true"></div>

  <section class="now" id="now" data-i18n-aria="nowAria"></section>

  <section class="filters" id="filters" data-i18n-aria="filtersAria"></section>

  <section data-i18n-aria="timelineAria">
    <div class="tl-scroll" id="tlScroll"><div class="tl" id="tl"></div></div>
    <p class="tl-note" data-i18n="tlNote"></p>
  </section>

  <section class="below">
    <div class="agenda" id="agenda" data-i18n-aria="agendaAria"></div>
    <aside class="detail" id="detail" aria-live="polite"></aside>
  </section>

  <footer>
    <p data-i18n="footer"></p>
    <ul id="sources"></ul>
  </footer>
</div>

<!-- Données (sans texte), puis un fichier par langue, puis l'application -->
<script src="data/2026.js"></script>
<script src="lang/fr.js"></script>
<script src="lang/en.js"></script>
<script src="js/app.js"></script>
</body>
</html>
